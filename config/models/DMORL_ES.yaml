# DMORL config for Emotional Support scenario
tokenizer: roberta-large
plm: roberta-large
lm_size: 1024
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
max_sequence_length: 512
cached_dir: "cache/MODPL/"
weight_decay: 0.01
learning_rate: 0.00005
num_warmup_steps: 3000
gradient_accumulation_steps: 1
num_train_epochs: 5
dropout: 0.1
max_grad_norm: 5
run_sft: true
run_rlt: true
run_online_eval: true
run_offline_eval: true
num_train_rl_epochs: 10
train_rl_batch_size: 128
sampled_times: 50
freeze_preference_backbone: true
objective_embedding_size: 6
num_train_q_network_epochs: 10
buffer_length: 2000
warmup_steps: 2000
# ── DMORL-specific ──────────────────────────────────────────────────────────
n_basic_skills: 5
n_advanced_skills: 5
n_skill_train_epochs: 10
n_advanced_train_epochs: 10
use_dynamic_weight: true
dynamic_weight_horizon: 3
use_hints: true
hints_file: "dmorl_hints_es.json"
skills_file: "dmorl_skills_es.json"
run_curriculum: true
force_rediscover_skills: true
saved_dir: "checkpoints/dmorl_es"
