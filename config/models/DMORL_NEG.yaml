# DMORL config for Negotiation scenario (R-PADPP variant)
tokenizer: roberta-large
plm: roberta-large
lm_size: 1024
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
max_sequence_length: 512
cached_dir: "cache/MODPL/"
weight_decay: 0.01
learning_rate: 0.00005
num_warmup_steps: 3000
gradient_accumulation_steps: 1
num_train_epochs: 2
dropout: 0.1
max_grad_norm: 5
run_sft: true
run_rlt: true
run_online_eval: true
run_offline_eval: true
num_train_rl_epochs: 10
train_rl_batch_size: 128
sampled_times: 50
freeze_preference_backbone: true
objective_embedding_size: 16
num_train_q_network_epochs: 20
buffer_length: 2000
warmup_steps: 30

# ── Phase 1: Basic skill curriculum ─────────────────────────────────────────
n_basic_skills: 7                    # 3 corners + 1 uniform + 3 edge midpoints
n_skill_train_epochs: 15             # RL epochs over the centralized basic skill mix
phase1_eval_episodes: 3              # Eval dialogues per skill after Phase 1
skills_file: "dmorl_skills_neg.json"
run_curriculum: true
force_rediscover_skills: false       # Use hand-crafted JSON anchors

# ── Phase 2: R-PADPP (Regret-Gated GPI) ─────────────────────────────────────
n_rpadpp_epochs: 30                  # RL epochs of regret-gated training
epsilon_threshold: 0.05              # Regret threshold for adding w to W_converged
q_old_update_freq: 1                 # Update Q_old every K RL epochs
regret_batch_size: 64                # State batch for regret estimation
n_candidate_w: 32                    # New random w's to evaluate per epoch
use_active_sampling: false           # If true, rollout under highest-regret w
alpha_rpadpp: 0.5                    # Weight: L = (1-α)·L_self + α·L_know

# ── Common ──────────────────────────────────────────────────────────────────
hints_file: "dmorl_hints_neg.json"
use_dynamic_weight: false
use_hints: false
saved_dir: "checkpoints/dmorl_neg"
