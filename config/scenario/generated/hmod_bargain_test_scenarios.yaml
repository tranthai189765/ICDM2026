- id: bargain_test_0001
  macro_goal: 'You are the buyer agent for housing. Ambiguous business objective: The buyer wants a very low price at first,
    but the policy must stop over-haggling once the seller signals frustration, firmness, or a credible final offer. Operational
    hints, not fixed weights: Open with a low but defensible offer; Use alternatives and budget pressure to justify the ask;
    Detect seller firmness or frustration; Shift to a serious counter inside the ceiling. Context comes from a real Craigslist
    bargain listing. The seller is expected to bargain consistently, so the buyer should keep the original objective unless
    the price itself crosses the private ceiling. Infer the local objective weights by reflection during the dialogue, and
    revise them when seller intent changes.'
